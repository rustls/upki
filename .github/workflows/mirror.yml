name: update mirror

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0,6,12,18 * * *"

jobs:
  generate:
    name: Generate backend files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Generate backend files
        run: |
          mkdir -p tmp/revocation/ tmp/intermediates
          cargo run --locked --release --bin mozilla-crlite -- tmp/revocation/ production --encoding=v4 --manifest-comment="$GITHUB_REPOSITORY run $GITHUB_RUN_ID"
          # backwards compatible location, v3 filters, and manifest
          cargo run --locked --release --bin mozilla-crlite -- tmp/ production --encoding=v3 --manifest-comment="$GITHUB_REPOSITORY run $GITHUB_RUN_ID"
          jq '. + {filters: .files} | del(.files)' tmp/manifest.json > tmp/manifest.json.new
          mv tmp/manifest.json.new tmp/manifest.json

          cargo run --locked --release --bin intermediates -- tmp/intermediates/ --manifest-comment="$GITHUB_REPOSITORY run $GITHUB_RUN_ID"

      - name: Package and upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./tmp/

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.repository == 'rustls/upki' && github.ref == 'refs/heads/main'
    needs: generate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
